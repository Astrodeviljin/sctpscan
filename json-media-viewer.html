<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visionneuse JSON & Médias</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #9aa1ac;
    --accent: #5b8cff;
    --accent-2: #ff7a5b;
    --ok: #4caf7d;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 16px;
    margin: 0 0 10px 0;
    color: var(--text);
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  textarea#input-box {
    flex: 1;
    min-height: 40px;
    max-height: 160px;
    resize: vertical;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .btn-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  button:disabled { opacity: 0.5; cursor: default; }
  input[type="file"] { display: none; }
  .toolbar {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
  }
  .tab-btn {
    background: transparent;
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 6px;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
  }
  select, input[type="text"].search {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  #status {
    padding: 10px 20px;
    color: var(--text-dim);
    font-size: 13px;
  }
  #status.error { color: var(--accent-2); }
  #status.ok { color: var(--ok); }
  main {
    padding: 20px;
  }
  .view { display: none; }
  .view.active { display: block; }

  /* Gallery */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--panel-2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; }
  .thumb .icon { font-size: 40px; color: var(--text-dim); }
  .meta { padding: 10px 12px; font-size: 12px; color: var(--text-dim); }
  .meta .title {
    color: var(--text);
    font-size: 13px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta .path {
    font-family: ui-monospace, monospace;
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 4px;
  }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    margin-right: 4px;
  }
  #gallery-empty {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    display: none;
  }

  /* JSON tree */
  #tree-container {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    overflow-x: auto;
  }
  .node { margin-left: 18px; }
  .node-root { margin-left: 0; }
  details { margin: 1px 0; }
  summary {
    cursor: pointer;
    color: var(--text-dim);
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: '▸';
    display: inline-block;
    width: 14px;
    color: var(--accent);
  }
  details[open] > summary::before { content: '▾'; }
  .key { color: #7bb0ff; }
  .str { color: #c3e88d; }
  .num { color: #f78c6c; }
  .bool { color: #ff7a5b; }
  .null { color: var(--text-dim); font-style: italic; }
  .count { color: var(--text-dim); font-size: 11px; }
  .leaf { margin-left: 18px; padding: 1px 0; }
  mark { background: var(--accent); color: #fff; border-radius: 3px; padding: 0 2px; }

  /* Lightbox */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; z-index: 100; padding: 30px;
  }
  #lightbox.open { display: flex; }
  #lightbox .content { max-width: 90vw; max-height: 75vh; display: flex; align-items: center; justify-content: center; }
  #lightbox img, #lightbox video, #lightbox audio { max-width: 90vw; max-height: 75vh; border-radius: 8px; }
  #lightbox .info { margin-top: 14px; color: var(--text-dim); font-size: 13px; text-align: center; max-width: 700px; }
  #lightbox .info a { color: var(--accent); }
  #lightbox .close {
    position: absolute; top: 20px; right: 30px; font-size: 26px;
    color: var(--text); cursor: pointer; background: none; border: none; padding: 4px 10px;
  }
  #lightbox .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.08); border: none; color: var(--text);
    font-size: 22px; padding: 10px 14px; border-radius: 8px; cursor: pointer;
  }
  #lightbox .prev { left: 20px; }
  #lightbox .next { right: 20px; }

  footer { text-align: center; color: var(--text-dim); font-size: 12px; padding: 20px; }
</style>
</head>
<body>

<header>
  <h1>🔎 Visionneuse JSON & Médias</h1>
  <div class="input-row">
    <textarea id="input-box" placeholder="Collez une URL d'API (ex: https://exemple.fr/wp-json/wp/v2/media?per_page=100) OU collez du JSON brut ici..."></textarea>
    <div class="btn-col">
      <button id="load-btn">Analyser</button>
      <button class="secondary" id="file-btn">Fichier local...</button>
      <input type="file" id="file-input" accept=".json,application/json" />
    </div>
  </div>
  <div class="toolbar">
    <div class="tabs">
      <button class="tab-btn active" id="tab-gallery">Galerie médias</button>
      <button class="tab-btn" id="tab-tree">Arbre JSON</button>
    </div>
    <select id="type-filter">
      <option value="">Tous les types de médias</option>
      <option value="image">Images</option>
      <option value="video">Vidéos</option>
      <option value="audio">Audios</option>
      <option value="other">Autres fichiers</option>
    </select>
    <input type="text" class="search" id="tree-search" placeholder="Rechercher dans le JSON..." style="display:none; min-width:220px;" />
    <button class="secondary" id="download-json-btn">Exporter JSON</button>
  </div>
</header>

<div id="status">Collez une URL d'API ou du JSON brut, puis cliquez sur "Analyser".</div>

<main>
  <div class="view active" id="view-gallery">
    <div class="grid" id="grid"></div>
    <div id="gallery-empty">Aucun média détecté dans ce JSON.</div>
  </div>
  <div class="view" id="view-tree">
    <div id="tree-container"></div>
  </div>
</main>

<footer>Visionneuse générique — fonctionne avec n'importe quelle URL JSON ou API (pagination WordPress détectée automatiquement)</footer>

<div id="lightbox">
  <button class="close" id="lb-close">&times;</button>
  <button class="nav prev" id="lb-prev">&#8249;</button>
  <button class="nav next" id="lb-next">&#8250;</button>
  <div class="content" id="lb-content"></div>
  <div class="info" id="lb-info"></div>
</div>

<script>
let rawData = null;
let mediaItems = [];   // { url, type, mime, path, label }
let filteredMedia = [];
let currentIndex = -1;

const inputBox = document.getElementById('input-box');
const loadBtn = document.getElementById('load-btn');
const fileBtn = document.getElementById('file-btn');
const fileInput = document.getElementById('file-input');
const statusEl = document.getElementById('status');
const typeFilter = document.getElementById('type-filter');
const downloadBtn = document.getElementById('download-json-btn');
const treeSearch = document.getElementById('tree-search');

const grid = document.getElementById('grid');
const galleryEmpty = document.getElementById('gallery-empty');
const treeContainer = document.getElementById('tree-container');

const tabGallery = document.getElementById('tab-gallery');
const tabTree = document.getElementById('tab-tree');
const viewGallery = document.getElementById('view-gallery');
const viewTree = document.getElementById('view-tree');

const lightbox = document.getElementById('lightbox');
const lbContent = document.getElementById('lb-content');
const lbInfo = document.getElementById('lb-info');

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = kind || '';
}

/* ---------- Tabs ---------- */
function showTab(name) {
  const isGallery = name === 'gallery';
  tabGallery.classList.toggle('active', isGallery);
  tabTree.classList.toggle('active', !isGallery);
  viewGallery.classList.toggle('active', isGallery);
  viewTree.classList.toggle('active', !isGallery);
  treeSearch.style.display = isGallery ? 'none' : '';
  typeFilter.style.display = isGallery ? '' : 'none';
}
tabGallery.addEventListener('click', () => showTab('gallery'));
tabTree.addEventListener('click', () => showTab('tree'));

/* ---------- Fetch (with WP-style pagination support) ---------- */
function looksLikeJson(text) {
  const t = text.trim();
  return t.startsWith('{') || t.startsWith('[');
}

async function fetchAllPages(rawUrl) {
  const base = new URL(rawUrl);
  base.searchParams.delete('page');
  let page = 1;
  let all = [];
  let totalPages = 1;
  let firstPayload = null;

  do {
    base.searchParams.set('page', String(page));
    const urlToFetch = page === 1 && !base.searchParams.has('per_page') ? rawUrl : base.toString();
    setStatus(`Chargement de la page ${page}${totalPages > 1 ? ' / ' + totalPages : ''}...`);
    const res = await fetch(page === 1 ? rawUrl : base.toString(), { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const data = await res.json();

    if (page === 1) firstPayload = data;

    const tp = res.headers.get('X-WP-TotalPages');
    if (tp) totalPages = parseInt(tp, 10) || 1;

    if (Array.isArray(data) && tp) {
      all = all.concat(data);
    } else {
      // Not a WP-style paginated array: just use the first response as-is.
      return data;
    }
    page++;
  } while (page <= totalPages);

  return all;
}

/* ---------- Media detection (recursive scan of arbitrary JSON) ---------- */
const IMG_RE = /\.(jpe?g|png|gif|webp|avif|svg|bmp|ico)(\?.*)?$/i;
const VIDEO_RE = /\.(mp4|webm|mov|m4v|ogv|avi|mkv)(\?.*)?$/i;
const AUDIO_RE = /\.(mp3|wav|ogg|m4a|flac|aac)(\?.*)?$/i;
const URL_RE = /^https?:\/\/\S+$/i;

function classifyUrl(str) {
  if (!URL_RE.test(str)) return null;
  if (IMG_RE.test(str)) return 'image';
  if (VIDEO_RE.test(str)) return 'video';
  if (AUDIO_RE.test(str)) return 'audio';
  return null;
}

function labelFromPath(path) {
  const parts = path.split(/[.\[\]]/).filter(Boolean);
  return parts.slice(-2).join(' / ') || path;
}

function findMediaUrls(node, path, out, seen) {
  if (node === null || node === undefined) return;
  if (Array.isArray(node)) {
    node.forEach((v, i) => findMediaUrls(v, `${path}[${i}]`, out, seen));
  } else if (typeof node === 'object') {
    for (const k of Object.keys(node)) {
      findMediaUrls(node[k], path ? `${path}.${k}` : k, out, seen);
    }
  } else if (typeof node === 'string') {
    const type = classifyUrl(node);
    if (type && !seen.has(node)) {
      seen.add(node);
      out.push({ url: node, type, path, label: labelFromPath(path) });
    } else if (!type && URL_RE.test(node) && /\.(pdf|docx?|xlsx?|zip|rar|7z)(\?.*)?$/i.test(node) && !seen.has(node)) {
      seen.add(node);
      out.push({ url: node, type: 'other', path, label: labelFromPath(path) });
    }
  }
}

/* Many CMS/APIs (WordPress included) embed several resized copies of the
   same picture (foo.jpg, foo-300x200.jpg, foo-1536x2048.jpg...). Group by
   filename stem so the gallery shows one card per real photo, with the
   other resolutions available as variants. */
function urlStem(rawUrl) {
  try {
    const u = new URL(rawUrl);
    const segments = u.pathname.split('/');
    let filename = segments.pop() || '';
    const dashSize = filename.match(/^(.*)-\d+x\d+(\.[a-z0-9]+)$/i);
    if (dashSize) filename = dashSize[1] + dashSize[2];
    const scaled = filename.match(/^(.*)-scaled(\.[a-z0-9]+)$/i);
    if (scaled) filename = scaled[1] + scaled[2];
    // Ignore protocol (http vs https often points at the same file) and host case.
    return u.host.toLowerCase() + segments.join('/') + '/' + filename;
  } catch {
    return rawUrl;
  }
}

function sizeScore(rawUrl) {
  const m = rawUrl.match(/-(\d+)x(\d+)\.[a-z0-9]+(\?.*)?$/i);
  if (!m) return Infinity; // no size suffix: treat as the original/full-size file
  return parseInt(m[1], 10) * parseInt(m[2], 10);
}

function dedupeVariants(items) {
  const groups = new Map();
  const result = [];
  for (const item of items) {
    if (item.type !== 'image') { result.push(item); continue; }
    const stem = urlStem(item.url);
    if (!groups.has(stem)) {
      const entry = { ...item, variants: [] };
      groups.set(stem, entry);
      result.push(entry);
    } else {
      const canonical = groups.get(stem);
      canonical.variants.push(item);
      if (sizeScore(item.url) > sizeScore(canonical.url)) {
        // Swap so the canonical card always shows/links the largest copy.
        canonical.variants[canonical.variants.length - 1] = { ...canonical, variants: undefined };
        Object.assign(canonical, item);
      }
    }
  }
  return result;
}

/* ---------- Gallery rendering ---------- */
function iconFor(type) {
  if (type === 'video') return '🎬';
  if (type === 'audio') return '🎵';
  return '📄';
}

function renderCard(item, index) {
  const card = document.createElement('div');
  card.className = 'card';

  const thumb = document.createElement('div');
  thumb.className = 'thumb';

  if (item.type === 'image') {
    const img = document.createElement('img');
    img.src = item.url;
    img.loading = 'lazy';
    thumb.appendChild(img);
  } else if (item.type === 'video') {
    const video = document.createElement('video');
    video.src = item.url;
    video.muted = true;
    thumb.appendChild(video);
  } else {
    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.textContent = iconFor(item.type);
    thumb.appendChild(icon);
  }

  const meta = document.createElement('div');
  meta.className = 'meta';

  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = item.label;

  const badges = document.createElement('div');
  const typeBadge = document.createElement('span');
  typeBadge.className = 'badge';
  typeBadge.textContent = item.type;
  badges.appendChild(typeBadge);

  if (item.variants && item.variants.length) {
    const variantBadge = document.createElement('span');
    variantBadge.className = 'badge';
    variantBadge.textContent = `+${item.variants.length} taille(s)`;
    badges.appendChild(variantBadge);
  }

  const path = document.createElement('div');
  path.className = 'path';
  path.textContent = item.path;

  meta.appendChild(title);
  meta.appendChild(badges);
  meta.appendChild(path);

  card.appendChild(thumb);
  card.appendChild(meta);
  card.addEventListener('click', () => openLightbox(index));

  return card;
}

function renderGallery() {
  grid.innerHTML = '';
  const activeFilter = typeFilter.value;
  filteredMedia = mediaItems.filter(it => !activeFilter || it.type === activeFilter);
  galleryEmpty.style.display = filteredMedia.length === 0 ? 'block' : 'none';
  filteredMedia.forEach((item, idx) => grid.appendChild(renderCard(item, idx)));
}

function openLightbox(index) {
  currentIndex = index;
  const item = filteredMedia[index];
  if (!item) return;

  lbContent.innerHTML = '';
  if (item.type === 'image') {
    const img = document.createElement('img');
    img.src = item.url;
    lbContent.appendChild(img);
  } else if (item.type === 'video') {
    const video = document.createElement('video');
    video.src = item.url;
    video.controls = true;
    video.autoplay = true;
    lbContent.appendChild(video);
  } else if (item.type === 'audio') {
    const audio = document.createElement('audio');
    audio.src = item.url;
    audio.controls = true;
    audio.autoplay = true;
    lbContent.appendChild(audio);
  } else {
    const link = document.createElement('a');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = 'Ouvrir le fichier';
    link.style.color = '#5b8cff';
    link.style.fontSize = '18px';
    lbContent.appendChild(link);
  }

  const variantLinks = (item.variants || [])
    .slice()
    .sort((a, b) => sizeScore(a.url) - sizeScore(b.url))
    .map(v => `<a href="${v.url}" target="_blank" rel="noopener noreferrer">${(v.url.match(/-(\d+x\d+)\./i) || [, 'originale'])[1]}</a>`)
    .join(' · ');

  lbInfo.innerHTML = `
    <div><strong>${item.label}</strong></div>
    <div>${item.type} — chemin JSON : <code>${item.path}</code></div>
    <div><a href="${item.url}" target="_blank" rel="noopener noreferrer">Ouvrir l'original</a></div>
    ${variantLinks ? `<div>Autres tailles : ${variantLinks}</div>` : ''}
  `;
  lightbox.classList.add('open');
}

function closeLightbox() {
  lightbox.classList.remove('open');
  lbContent.innerHTML = '';
}
function showNext(offset) {
  if (filteredMedia.length === 0) return;
  currentIndex = (currentIndex + offset + filteredMedia.length) % filteredMedia.length;
  openLightbox(currentIndex);
}
document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', () => showNext(-1));
document.getElementById('lb-next').addEventListener('click', () => showNext(1));
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') showNext(-1);
  if (e.key === 'ArrowRight') showNext(1);
});

/* ---------- JSON tree rendering ---------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx + query.length)) + '</mark>' + escapeHtml(text.slice(idx + query.length));
}

function nodeMatches(node, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  if (node === null) return 'null'.includes(q);
  if (typeof node === 'object') {
    return Object.entries(node).some(([k, v]) => k.toLowerCase().includes(q) || nodeMatches(v, query));
  }
  return String(node).toLowerCase().includes(q);
}

function renderValue(node, query) {
  if (node === null) return `<span class="null">null</span>`;
  if (typeof node === 'string') return `<span class="str">"${highlightMatch(node, query)}"</span>`;
  if (typeof node === 'number') return `<span class="num">${node}</span>`;
  if (typeof node === 'boolean') return `<span class="bool">${node}</span>`;
  return '';
}

function buildTree(node, key, query, depth) {
  const isContainer = node !== null && typeof node === 'object';
  const wrapper = document.createElement('div');
  wrapper.className = depth === 0 ? 'node node-root' : 'node';

  if (!isContainer) {
    const keyMatches = key !== null && query && String(key).toLowerCase().includes(query.toLowerCase());
    if (!keyMatches && !nodeMatches(node, query)) return null;
    const line = document.createElement('div');
    line.className = 'leaf';
    line.innerHTML = key !== null ? `<span class="key">${highlightMatch(String(key), query)}</span>: ${renderValue(node, query)}` : renderValue(node, query);
    wrapper.appendChild(line);
    return wrapper;
  }

  const isArray = Array.isArray(node);
  const entries = isArray ? node.map((v, i) => [i, v]) : Object.entries(node);
  const children = [];
  for (const [k, v] of entries) {
    const child = buildTree(v, k, query, depth + 1);
    if (child) children.push(child);
  }
  if (query && children.length === 0) return null;

  const details = document.createElement('details');
  if (depth < 1 || query) details.open = true;
  const summary = document.createElement('summary');
  const label = key !== null ? `<span class="key">${highlightMatch(String(key), query)}</span>: ` : '';
  summary.innerHTML = `${label}${isArray ? '[' : '{'} <span class="count">${entries.length} ${isArray ? 'élément(s)' : 'clé(s)'}</span> ${isArray ? ']' : '}'}`;
  details.appendChild(summary);
  children.forEach(c => details.appendChild(c));
  wrapper.appendChild(details);
  return wrapper;
}

function renderTree(query) {
  treeContainer.innerHTML = '';
  if (rawData === null) return;
  const tree = buildTree(rawData, null, query || '', 0);
  if (tree) treeContainer.appendChild(tree);
  else treeContainer.innerHTML = '<div style="color:var(--text-dim)">Aucun résultat.</div>';
}

let treeDebounce;
treeSearch.addEventListener('input', () => {
  clearTimeout(treeDebounce);
  treeDebounce = setTimeout(() => renderTree(treeSearch.value.trim()), 150);
});

/* ---------- Load pipeline ---------- */
function processData(data) {
  rawData = data;
  const found = [];
  findMediaUrls(data, '', found, new Set());
  mediaItems = dedupeVariants(found);
  renderGallery();
  renderTree('');
  const count = Array.isArray(data) ? data.length : (typeof data === 'object' ? Object.keys(data).length : 1);
  const hiddenVariants = found.length - mediaItems.length;
  const variantNote = hiddenVariants > 0 ? ` (${hiddenVariants} variante(s) de taille regroupée(s))` : '';
  setStatus(`JSON chargé : ${mediaItems.length} média(s) détecté(s)${variantNote}, ${count} entrée(s) racine.`, 'ok');
}

async function handleLoad() {
  const raw = inputBox.value.trim();
  if (!raw) {
    setStatus('Veuillez saisir une URL ou coller du JSON.', 'error');
    return;
  }
  loadBtn.disabled = true;
  try {
    if (looksLikeJson(raw)) {
      setStatus('Analyse du JSON collé...');
      const data = JSON.parse(raw);
      processData(data);
    } else {
      const data = await fetchAllPages(raw);
      processData(data);
    }
  } catch (err) {
    console.error(err);
    setStatus(
      `Erreur : ${err.message}. Si l'URL est bloquée par CORS, ouvrez le fichier via un serveur local, ou collez directement le JSON.`,
      'error'
    );
  } finally {
    loadBtn.disabled = false;
  }
}

loadBtn.addEventListener('click', handleLoad);
inputBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) handleLoad();
});

fileBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    inputBox.value = `(fichier chargé : ${file.name})`;
    processData(data);
  } catch (err) {
    setStatus(`Fichier JSON invalide : ${err.message}`, 'error');
  }
});

downloadBtn.addEventListener('click', () => {
  if (rawData === null) {
    setStatus('Rien à exporter, chargez d\'abord un JSON.', 'error');
    return;
  }
  const blob = new Blob([JSON.stringify(rawData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  a.click();
  URL.revokeObjectURL(url);
});

typeFilter.addEventListener('change', renderGallery);
</script>

</body>
